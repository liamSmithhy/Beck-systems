<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Portal — Beck Systems</title>
<meta name="description" content="Beck Systems client & project portal — track your build, leave feedback, view invoices, and submit maintenance requests." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#F3F0E7" />
<link rel="stylesheet" href="/portal/portal.css" />
</head>
<body>
<div id="app">
  <div class="loading" id="boot">Loading portal…</div>
</div>

<!-- Login view -->
<template id="tpl-login">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="auth-brand" href="/">
        <svg viewBox="0 0 44 32" width="46" fill="none" aria-hidden="true">
          <circle cx="15" cy="16" r="11" stroke="#100F0C" stroke-width="3.2"/>
          <circle cx="28" cy="16" r="11" stroke="#A98A44" stroke-width="3.2"/>
        </svg>
        <span>Beck Systems</span>
      </a>
      <h1>Client Portal</h1>
      <p class="auth-sub">Track your build, leave feedback, and manage invoices.</p>
      <form id="loginForm">
        <label>Username or email
          <input id="loginId" type="text" autocomplete="username" required placeholder="you@business.com" />
        </label>
        <label>Password
          <input id="loginPw" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </label>
        <button class="btn btn--gold" type="submit" id="loginBtn">Sign in</button>
        <p class="auth-note" id="loginNote"></p>
      </form>
      <p class="auth-foot">Need an account? <a href="/#contact">Ask Beck Systems</a> — accounts are created for you.</p>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/portal/portal.js"></script>
</body>
</html>
